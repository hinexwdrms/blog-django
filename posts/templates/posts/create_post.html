{% extends 'base.html' %}
{% block title %}Create Post{% endblock %}
{% block content %}

<div class="card">
    <div class="card-body">
        <h2>Create Post</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Create</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
