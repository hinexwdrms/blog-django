{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2>Register</h2>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Register</button>
                    <a href="/login/" class="btn btn-secondary">Already have an account?</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
